# This workflow used to be a one-line call to the shared workflow
# codehaus-plexus/.github/.github/workflows/maven.yml@master. It is inlined here because
# the build now loads the mvn-lens core extension (.mvn/extensions.xml) to record every
# CI build, and that needs two steps the shared workflow does not offer: resolving the
# extension from the Maven Central snapshot repository before any Maven invocation, and
# publishing the report it produces. Everything else is a copy of the shared workflow with
# Modello's arguments applied, so keep the jobs below in sync with it.
#
# The reports are published with mvn-perf/build-monitor (https://github.com/mvn-perf/build-monitor):
# each Maven job commits its report.html to this run's inbox branch, the "Build monitoring"
# job links the monitoring page from the run summary, and .github/workflows/build-monitor.yml
# turns both into the page at https://mvn-perf.github.io/modello/.
#
# Do not move the build arguments into an env entry named MAVEN_ARGS: Maven 3.9 reads that
# variable itself and appends it to every invocation, so the wrapper bootstrap would run
# the whole build too.

name: GitHub CI

on: [push, pull_request]

jobs:

  build:
    name: fail-fast-build
    runs-on: ubuntu-latest
    # execute on any push or pull request from forked repo
    if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) &&
      !startsWith(github.event.head_commit.message , '[maven-release-plugin] prepare release')
    permissions:
      contents: write   # build-monitor/report commits the mvn-lens report to the inbox branch
      actions: read     # … and identifies its own job/step through the Jobs API

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      # Must come before any Maven invocation rooted at the checkout, the wrapper bootstrap
      # below included: Maven loads the core extensions listed in .mvn/extensions.xml before
      # it reads pom.xml, resolving them from settings.xml only, so the Maven Central
      # snapshot repository serving mvn-lens cannot be declared in pom.xml. Building
      # .mvn/pom.xml downloads the extension into the local repository, where every later
      # invocation finds it. See .mvn/pom.xml.
      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: mvn --batch-mode --errors --no-transfer-progress --update-snapshots dependency:resolve

      # mvn-lens is switched off here: this bootstrap invocation is not the build being
      # monitored, and its report would otherwise be left behind if the real build below
      # never reaches the end of its session.
      - name: Set up Maven
        run: mvn --errors --batch-mode --show-version "-Dmvnlens.disabled=true" org.apache.maven.plugins:maven-wrapper-plugin:3.3.2:wrapper "-Dtype=only-script" "-Dmaven=3.9.11"

      - name: Build with Maven
        run: ./mvnw --batch-mode --errors --show-version verify javadoc:javadoc -Prun-its

      # mvn-lens writes the report when the Maven session ends, a failed one included,
      # which is exactly the build worth looking at - hence !cancelled(). The report is
      # committed to the monitoring inbox branch (no artifact) and linked from the job
      # summary. It must come right after the Maven step it profiles: a later Maven
      # invocation in the same job would overwrite target/mvnlens/report.html.
      - name: Publish the mvn-lens build report
        if: ${{ !cancelled() }}
        uses: mvn-perf/build-monitor/report@main
        with:
          job-name: fail-fast-build

  verify:
    needs: build
    name: ${{ matrix.os }} jdk-${{ matrix.jdk }}-${{ matrix.distribution }}

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ 'ubuntu-latest', 'windows-latest', 'macos-latest' ]
        jdk: [ '25', '21', '8' ]
        distribution: [ 'zulu' ]
    permissions:
      contents: write   # build-monitor/report commits the mvn-lens report to the inbox branch
      actions: read     # … and identifies its own job/step through the Jobs API

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.jdk }}
          distribution: ${{ matrix.distribution }}
          cache: 'maven'

      - name: Pre-resolve the mvn-lens extension
        working-directory: .mvn
        run: mvn --batch-mode --errors --no-transfer-progress --update-snapshots dependency:resolve

      - name: Set up Maven
        run: mvn --errors --batch-mode --show-version "-Dmvnlens.disabled=true" org.apache.maven.plugins:maven-wrapper-plugin:3.3.2:wrapper "-Dtype=only-script" "-Dmaven=3.9.11"

      - name: Build with Maven
        run: ./mvnw --batch-mode --errors --show-version verify javadoc:javadoc -Prun-its

      # Committed to the monitoring inbox branch (no artifact), see the build job.
      - name: Publish the mvn-lens build report
        if: ${{ !cancelled() }}
        uses: mvn-perf/build-monitor/report@main
        with:
          job-name: ${{ matrix.os }} jdk-${{ matrix.jdk }}-${{ matrix.distribution }}

  monitoring:

    name: Build monitoring
    needs: [build, verify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Link the monitoring page from the run summary
        uses: mvn-perf/build-monitor/summary@main
